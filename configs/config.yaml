audio:
  sample_rate: 16000
  duration_seconds: 5
  mono: true

corruption:
  min_gap_ms: 40
  max_gap_ms: 80
  cumulative_gap_ms: 200

stft:
  # STFT parameters matching the paper (Table I): n_fft=1024, hop=120, win=600 @ 16 kHz.
  # These values are now driven from here and NOT hard-coded in any script.
  n_fft: 1024
  hop_length: 120
  win_length: 600

model:
  name: multiresunet
  input_channels: 2
  output_channels: 2
  base_filters: 7          # paper: filter counts 21/43/64 per block (alpha=1.6 * 7)
  alpha: 1.6               # MultiRes width multiplier
  negative_slope: 0.01     # LeakyReLU slope (GroupNorm(1,C) used, not BatchNorm)
  # use_harmonic=true enables HarmonicConv2d in the encoder; decoders remain regular Conv2d
  use_harmonic: true
  harmonic_anchors:
    # Anchor 1 at every block = anchor at DC (bin 1 in 1-based indexing).
    # Per-block anchors are an open item: Table I is partially illegible in the source PDF.
    # To configure per-block anchors, pass a dict here or extend MultiResUNet to accept a list.
    default: 1
    res_path_residual: 1
    downsampling_conv1: 1

optimization:
  epochs: 5000
  learning_rate: 0.01
  optimizer: Adam
  noise_variance: 0.1          # input noise variance (uniform)
  perturbation_variance: 0.03  # per-iteration Gaussian perturbation variance

loss:
  use_mss: false     # false = MSE-only (paper default, reproducible); true = MSE+MSS
  alpha_mse: 1.0     # weight for masked MSE term
  alpha_mss: 0.1     # weight for multi-scale spectrogram term (only when use_mss=true)

pipeline:
  preserve_observed: false  # false = paper default; true = paste back observed samples post-inpaint
  save_checkpoint: false    # save model state dict as checkpoint.pt in run dir
  log_every: 50             # frequency (epochs) of missing-region diagnostic logging
  variant: multires_harmonic # label used in experiments/<variant>/results.csv

run:
  out_dir: outputs/runs     # parent directory for timestamped run directories
