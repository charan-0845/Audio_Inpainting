# Smoke / CI config: overrides for fast CPU testing only.
# Inherits everything from configs/config.yaml; values here take priority
# when passed via `--config configs/smoke.yaml`.

optimization:
  epochs: 10         # tiny for CI; use config.yaml for real runs

model:
  channel_schedule: [8, 8, 8, 8, 8]    # smaller model for speed
  res_path_lengths: [4, 3, 2, 1]
  use_harmonic: false

pipeline:
  log_every: 5
